name: CI
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev || true
      - run: mkdir -p probe && PROBE_OUT=$PWD/probe cargo test -p fieldcraft-engine --lib probe_dump_plate -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
